<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TopStock pre-flight</title>
<style>
  :root { color-scheme: light dark; --bg:#FFFFFF; --surface:#F5F5F7; --border:#D2D2D7; --text:#1D1D1F; --muted:#6E6E73; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000000; --surface:#1C1C1E; --border:#3A3A3C; --text:#F5F5F7; --muted:#98989D; } }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; background:var(--bg); color:var(--text);
         font:15px/1.4 -apple-system, "SF Pro Text", Inter, system-ui, sans-serif; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:32px 40px; }
  h1 { margin:0 0 8px; font-size:28px; letter-spacing:-0.01em; }
  p { margin:0; color:var(--muted); }
</style></head>
<body><div class="card"><h1>Playwright pre-flight</h1><p>Local test page served from localhost. Fake content only.</p></div></body>
</html>
