# TEMPLATE for the private repository topstock-ops. Never add it to topstock-crm's own .github/workflows.
# Haider pastes this file into topstock-ops as .github/workflows/security-digest.yml (docs/go-live.md, part I3.3;
# runbook docs/ops-templates/security-digest.md). Master Plan section 8 item 43 ("No security monitoring").
#
# What it does, once a day (and by hand):
#   1. Asks GitHub whether the latest finished run of backup-prod, keep-alive and sweep-lead-files succeeded and started
#      in the last 26 hours, and whether each workflow is still enabled.
#   2. Reads one table of counts from production: private.security_digest (migration
#      20261023090000_security_digest.sql in topstock-crm). Sign-ins, unfinished two-factor codes, reset emails, new
#      accounts, accounts without an authenticator, role changes, removed accounts, deletes, file opens, imports, the
#      client sharing switch. Counts only: no name, email, IP address, lead or file name ever comes back.
#   3. Compares each count with its limit (LIMITS below) and writes a summary on the run's page.
# How it "emails": when any check is over its limit, the run turns RED. GitHub emails Haider about a red scheduled run
# (scheduled runs notify the person who last changed the schedule line; go-live part I3.3 checks the setting). When
# everything is within its limits, the run is GREEN and sends nothing. Red means "look", not "attack": an import or an
# invitation Haider did himself also turns it red once. The runbook says what to do for each line.
#
# Reads only, three ways:
#   - the database session is a READ ONLY transaction (Postgres refuses any write in it);
#   - inside it the session switches to the role security_digest_reader (SET LOCAL ROLE), which can do one thing:
#     run private.security_digest. It cannot read a table or call another function;
#   - the function itself only counts (STABLE, static SQL; tested in supabase/tests/digest_attack.sql).
# It signs in with the database secrets topstock-ops already holds for backup-prod, so it needs NO new secret:
#   PROD_PROJECT_REF, PROD_DB_PASSWORD, PROD_DB_POOLER_HOST (go-live part C5).
# The first two layers guard against a mistake in this file's SQL. They do not stop a person who can edit this
# repository's workflows: the session is signed in as postgres (it could switch back), and such a person can read that
# password through backup-prod anyway. So this workflow adds no new exposure. The stricter option (a separate database
# login for the reader role, with its own secret) is described in the runbook.
# The GitHub check uses this repository's own short-lived token (GITHUB_TOKEN) with "actions: read" only.
# No third-party action is used (nothing to pin): only bash, curl, jq and psql from GitHub's runner image.
# Actions minutes: one short job, under a minute, rounded up to 1 minute a day (about 30 a month).
name: security-digest
on:
  schedule:
    - cron: "13 9 * * *" # every day at 09:13 UTC (11:13 Paris in summer, 10:13 in winter), after the night's backup,
                         # sweep and keep-alive runs
  workflow_dispatch:
permissions:
  actions: read
jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # The day looked at: the last 25 hours, so a late start never leaves a gap (an event in the overlapping hour can
      # show in two days' digests).
      WINDOW_HOURS: "25"
      # Highest value that stays green, one per line. Change a number here only after talking to Claude (runbook).
      LIMITS: |
        signin.codes_not_finished=3
        signin.password_ok_no_code=3
        signin.most_by_one_person=20
        signin.sessions_most_by_one_user=20
        signin.reset_emails=0
        accounts.new=0
        accounts.without_two_factor=0
        accounts.authenticators_added=0
        accounts.role_changes=0
        accounts.people_removed=0
        data.leads_deleted=10
        data.files_deleted=20
        data.rows_deleted=300
        data.file_opens_most_by_one_person=100
        data.imports_done=0
        data.imports_undone=0
        data.sharing_switch_changes=0
        audit.unknown_actions=0
    steps:
      - name: Check the other daily workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          problems="$RUNNER_TEMP/problems.txt"
          out="$RUNNER_TEMP/workflows.md"
          touch "$problems"
          api="${GITHUB_API_URL:-https://api.github.com}/repos/${REPO}/actions/workflows"
          now=$(date -u +%s)
          {
            echo "### Other daily workflows"
            echo
            echo "| Workflow | Enabled | Latest finished run | Result |"
            echo "|---|---|---|---|"
          } > "$out"
          for wf in backup-prod.yml keep-alive.yml sweep-lead-files.yml; do
            info=$(curl -sS --fail-with-body --max-time 20 -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" "$api/$wf") || info=""
            state=$(jq -r '.state // empty' <<<"$info" 2>/dev/null || true)
            if [ -z "$state" ]; then
              echo "| $wf | ? | none | not found |" >> "$out"
              echo "Workflow $wf was not found in topstock-ops (is it pasted as .github/workflows/$wf?)." >> "$problems"
              continue
            fi
            runs=$(curl -sS --fail-with-body --max-time 20 -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "$api/$wf/runs?status=completed&per_page=1&exclude_pull_requests=true") || runs=""
            conclusion=$(jq -r '.workflow_runs[0].conclusion // "none"' <<<"$runs" 2>/dev/null || echo none)
            started=$(jq -r '.workflow_runs[0].run_started_at // .workflow_runs[0].created_at // empty' <<<"$runs" 2>/dev/null || true)
            age_h="?"
            if [ -n "$started" ]; then
              age_h=$(( (now - $(date -u -d "$started" +%s)) / 3600 ))
            fi
            enabled=yes
            [ "$state" = "active" ] || enabled="no ($state)"
            echo "| $wf | $enabled | ${started:-none} (${age_h} h ago) | $conclusion |" >> "$out"
            if [ "$state" != "active" ]; then
              echo "Workflow $wf is not enabled (state: $state)." >> "$problems"
            fi
            if [ "$conclusion" != "success" ]; then
              echo "The latest finished run of $wf did not succeed (result: $conclusion)." >> "$problems"
            elif [ "$age_h" = "?" ] || [ "$age_h" -ge 26 ]; then
              echo "Workflow $wf has not finished a run in the last 26 hours (latest: ${started:-none})." >> "$problems"
            fi
          done
          cat "$out"

      - name: Read the day's security counts (read-only)
        if: always()
        env:
          PGHOST: ${{ secrets.PROD_DB_POOLER_HOST }}
          PGPORT: "5432"
          PGUSER: postgres.${{ secrets.PROD_PROJECT_REF }}
          PGPASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          PGDATABASE: postgres
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: "20"
          PGAPPNAME: security-digest
        run: |
          set -uo pipefail
          problems="$RUNNER_TEMP/problems.txt"
          out="$RUNNER_TEMP/digest.txt"
          touch "$problems"
          : > "$out"
          if ! [[ "$WINDOW_HOURS" =~ ^[0-9]{1,3}$ ]] || [ "$WINDOW_HOURS" -lt 1 ] || [ "$WINDOW_HOURS" -gt 192 ]; then
            echo "WINDOW_HOURS must be a whole number from 1 to 192; the database was not read." >> "$problems"
            exit 0
          fi
          if [ -z "$PGPASSWORD" ] || [ -z "$PGHOST" ] || [ "$PGUSER" = "postgres." ]; then
            echo "A database secret is missing (PROD_DB_PASSWORD, PROD_DB_POOLER_HOST or PROD_PROJECT_REF); the database was not read." >> "$problems"
            exit 0
          fi
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          fi
          # READ ONLY transaction, then the reader role: this SQL can only run the digest.
          cat > "$RUNNER_TEMP/digest.sql" <<'SQL'
          begin transaction read only;
          set local role security_digest_reader;
          set local statement_timeout = '30s';
          select d.metric || '|' || d.value
            from private.security_digest(now() - make_interval(hours => :window_hours)) d;
          commit;
          SQL
          if ! psql -X -q -A -t -v ON_ERROR_STOP=1 -v window_hours="$WINDOW_HOURS" \
                -f "$RUNNER_TEMP/digest.sql" > "$out" 2> "$RUNNER_TEMP/psql-error.txt"; then
            echo "::warning::psql said: $(head -c 300 "$RUNNER_TEMP/psql-error.txt" | tr '\n' ' ')"
            echo "Could not read the security counts from the database (see the warning in this step's log)." >> "$problems"
            : > "$out"
          fi
          rm -f "$RUNNER_TEMP/psql-error.txt"
          echo "Read $(grep -c . "$out" || true) counts."

      - name: Decide and write the summary
        if: always()
        run: |
          set -uo pipefail
          problems="$RUNNER_TEMP/problems.txt"
          digest="$RUNNER_TEMP/digest.txt"
          touch "$problems" "$digest"
          declare -A val limit
          declare -A label=(
            [signin.completed]="Sign-ins finished with the 6-digit code"
            [signin.people]="People who signed in"
            [signin.most_by_one_person]="Most sign-ins through the app by one person"
            [signin.step_up_codes]="\"Confirm it's you\" codes entered"
            [signin.passwords_accepted]="Passwords accepted (sign-ins started)"
            [signin.password_ok_no_code]="Password accepted, code never finished"
            [signin.codes_not_finished]="6-digit codes asked for, never entered right (sign-in or Confirm it's you)"
            [signin.reset_emails]="Password-reset emails sent"
            [signin.sessions_most_by_one_user]="Most sign-ins by one account (any way in, app or not)"
            [accounts.users]="Accounts in total"
            [accounts.new]="New accounts"
            [accounts.without_two_factor]="Accounts without a working authenticator app"
            [accounts.authenticators_added]="Authenticator apps added"
            [accounts.admins]="Admins in total"
            [accounts.role_changes]="Role changes"
            [accounts.people_removed]="Accounts removed"
            [data.leads_deleted]="Leads deleted"
            [data.files_deleted]="Files deleted"
            [data.rows_deleted]="Records deleted (all kinds)"
            [data.file_opens]="Files opened"
            [data.file_opens_most_by_one_person]="Most files opened by one person"
            [data.imports_done]="Imports committed"
            [data.imports_undone]="Imports undone"
            [data.import_undo_leads_removed]="Leads removed by an import undo"
            [data.stock_adjustments]="Stock adjustments"
            [data.sharing_switch_changes]="Client sharing switched on or off"
            [data.share_links_created]="Client links created"
            [audit.rows]="Audit log entries"
            [audit.unknown_actions]="Audit entries of a kind this digest does not know"
            [ops.file_sweeps]="Orphan sweeper runs recorded"
          )
          order=(
            signin.completed signin.people signin.most_by_one_person signin.step_up_codes signin.passwords_accepted
            signin.password_ok_no_code signin.codes_not_finished signin.reset_emails signin.sessions_most_by_one_user
            accounts.users accounts.new accounts.without_two_factor accounts.authenticators_added accounts.admins
            accounts.role_changes accounts.people_removed
            data.leads_deleted data.files_deleted data.rows_deleted data.file_opens data.file_opens_most_by_one_person
            data.imports_done data.imports_undone data.import_undo_leads_removed data.stock_adjustments
            data.sharing_switch_changes data.share_links_created
            audit.rows audit.unknown_actions ops.file_sweeps
          )

          while IFS='=' read -r k v; do
            [ -z "$k" ] && continue
            if ! [[ "$k" =~ ^[a-z_]+\.[a-z_]+$ && "$v" =~ ^[0-9]+$ ]]; then
              echo "LIMITS has a line that is not name=number: '$k=$v'." >> "$problems"
              continue
            fi
            limit[$k]=$v
          done <<< "$LIMITS"
          # A misspelt name would silently switch its check off: every limit must name a metric the digest sends.
          for k in "${!limit[@]}"; do
            known=no
            for o in "${order[@]}"; do [ "$o" = "$k" ] && known=yes && break; done
            [ "$known" = yes ] || echo "LIMITS names $k, which the digest does not send (a typo switches that check off)." >> "$problems"
          done

          if [ -s "$digest" ]; then
            while IFS='|' read -r k v; do
              [ -z "$k" ] && continue
              if [[ "$k" =~ ^[a-z_]+\.[a-z_]+$ && "$v" =~ ^[0-9]+$ ]]; then
                val[$k]=$v
              else
                echo "The database sent a line this workflow does not understand." >> "$problems"
              fi
            done < "$digest"
            if [ "${val[digest.version]:-}" != "1" ]; then
              echo "The database's digest is version '${val[digest.version]:-none}', this workflow expects 1: ask Claude for the matching template." >> "$problems"
            fi
            for k in "${order[@]}"; do
              [ -n "${val[$k]:-}" ] || echo "The database sent no value for $k: ask Claude for the matching template." >> "$problems"
            done
            for k in "${!limit[@]}"; do
              if [ -n "${val[$k]:-}" ] && [ "${val[$k]}" -gt "${limit[$k]}" ]; then
                echo "${label[$k]:-$k}: ${val[$k]} (limit ${limit[$k]})." >> "$problems"
              fi
            done
          fi

          red=no
          [ -s "$problems" ] && red=yes
          {
            if [ "$red" = yes ]; then
              echo "## security-digest: RED, something to look at"
              echo
              echo "Open docs/ops-templates/security-digest.md in topstock-crm, section \"When it is red\", and find each line below."
              echo
              sort -u "$problems" | sed 's/^/- /'
            else
              echo "## security-digest: green, nothing over its limit"
            fi
            echo
            echo "Window: the last ${WINDOW_HOURS} hours, up to $(date -u +'%Y-%m-%d %H:%M') UTC. Counts only: no names, emails or IP addresses."
            echo
            if [ -s "$digest" ]; then
              echo "### Counts"
              echo
              echo "| What | Count | Limit | |"
              echo "|---|---:|---:|---|"
              for k in "${order[@]}"; do
                v="${val[$k]:-?}"
                l="${limit[$k]:-}"
                mark=""
                if [ -n "$l" ] && [[ "$v" =~ ^[0-9]+$ ]] && [ "$v" -gt "$l" ]; then mark="over"; fi
                echo "| ${label[$k]} | $v | ${l:--} | $mark |"
              done
              echo
            fi
            cat "$RUNNER_TEMP/workflows.md" 2>/dev/null || true
            echo
            echo "Not in these counts: wrong passwords (only in account B > Logs > Auth) and exports (none exist in Release 1)."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$red" = yes ]; then
            sort -u "$problems" | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          fi
          echo "All checks within their limits."
