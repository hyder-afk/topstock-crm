# Every PR: lint, typecheck, build, Playwright (signed-out + full sign-in journey), npm audit (runtime deps), Semgrep.
# gitleaks runs in gitleaks.yml; database RLS tests in db.yml.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  # Public placeholders so the build and tests never need real project values.
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-publishable-key
  NEXT_TELEMETRY_DISABLED: "1"
# One run per PR: a new commit cancels the run for the older one (only the newest commit counts for merging, and it
# always gets the full suite). Pushes to main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Day 7b: no native pickers or popups (raw <select>, date/time/search inputs, title= tooltips, <summary>,
      # confirm/alert/prompt, forms without noValidate). Also covered by tests/unit/native-controls.spec.ts.
      - run: npm run check:native
      # Pure import rules in Node (playwright.unit.config.ts): no browser, no server.
      - run: npm run test:unit
      - run: npm audit --omit=dev --audit-level=high
      - name: npm audit (dev tooling, report only)
        run: npm audit --audit-level=critical || true
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
  # The whole sign-in journey (invite email, password, two-factor wall, sign-in, reset), the evidence screenshots and the
  # app shell against a throwaway local Supabase. Uses only the local stack's built-in demo keys; no project values or
  # secrets. One job per engine, in parallel: Chromium runs everything; WebKit (Safari's engine) runs the shell tests.
  # WebKit needs ~116 MB of Ubuntu packages that Chromium does not (already on the runner image); on 9 Oct the Ubuntu
  # mirror served them at ~94 kB/s (21 minutes), hence its longer limits. The limits stop a hung run holding a runner.
  auth-journey:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The whole suite with the evidence screenshots runs on Chromium, split by file into two halves that run side
          # by side (Day 5 + Team took one Chromium job past 45 minutes; same tests, about half the wait).
          - browser: chromium
            shard: 1/2
            part: "1"
            timeout: 45
          - browser: chromium
            shard: 2/2
            part: "2"
            timeout: 45
          - browser: webkit
            shard: 1/1
            part: "1"
            timeout: 45
    timeout-minutes: ${{ matrix.timeout }}
    env:
      BROWSER: ${{ matrix.browser }}
      SHARD: ${{ matrix.shard }}
      E2E_STORAGE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Storage runs from Day 4d (files: uploads, the check on every open, deletes; tests/auth/files.spec.ts and the
      # storage spikes S2 to S4 in tests/auth/files-spikes.spec.ts, which only run with E2E_STORAGE=1).
      - name: Start local Supabase (database, auth, REST, storage, gateway, mail inbox)
        run: npx supabase start -x realtime,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Read the local stack's URL and demo keys
        run: |
          npx supabase status -o json > "$RUNNER_TEMP/sb.json"
          echo "status keys: $(jq -r 'keys | join(", ")' "$RUNNER_TEMP/sb.json")"
          url=$(jq -r '.API_URL // empty' "$RUNNER_TEMP/sb.json")
          anon=$(jq -r '.ANON_KEY // .PUBLISHABLE_KEY // empty' "$RUNNER_TEMP/sb.json")
          service=$(jq -r '.SERVICE_ROLE_KEY // .SECRET_KEY // empty' "$RUNNER_TEMP/sb.json")
          mail=$(jq -r '.MAILPIT_URL // .INBUCKET_URL // "http://127.0.0.1:54324"' "$RUNNER_TEMP/sb.json")
          db=$(jq -r '.DB_URL // empty' "$RUNNER_TEMP/sb.json")
          rm "$RUNNER_TEMP/sb.json"
          test -n "$url" && test -n "$anon" && test -n "$service" && test -n "$db"
          echo "::add-mask::$service"
          {
            echo "LOCAL_URL=$url"
            echo "LOCAL_ANON=$anon"
            echo "SUPABASE_LOCAL_URL=$url"
            echo "SUPABASE_LOCAL_SERVICE_ROLE_KEY=$service"
            echo "MAILPIT_URL=$mail"
            echo "SUPABASE_LOCAL_DB_URL=$db"
          } >> "$GITHUB_ENV"
      - name: Build against the local stack
        run: NEXT_PUBLIC_SUPABASE_URL="$LOCAL_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="$LOCAL_ANON" npm run build
      - name: Install the browser and its system libraries
        timeout-minutes: 30
        run: npx playwright install --with-deps "$BROWSER"
      - name: Sign-in journey and app shell
        run: NEXT_PUBLIC_SUPABASE_URL="$LOCAL_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="$LOCAL_ANON" npx playwright test -c playwright.auth.config.ts --project="$BROWSER" --shard="$SHARD"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: auth-journey-report-${{ matrix.browser }}-${{ matrix.part }}
          path: test-results/
          retention-days: 7
      # Evidence screenshots of every screen (fake local users only; Chromium).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() && matrix.browser == 'chromium'
        with:
          name: auth-screens-${{ matrix.part }}
          path: test-results/screens/
          retention-days: 14
      # Storage spikes S2 to S4 as measured on this stack (tests/auth/files-spikes.spec.ts; Day 4d README).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && matrix.browser == 'chromium'
        with:
          name: storage-spikes-${{ matrix.part }}
          path: test-results/spikes/
          retention-days: 30
      # The same results as annotations (readable through the API, unlike the artifact).
      - name: Storage spikes S2 to S5 as annotations
        if: always() && matrix.browser == 'chromium' && hashFiles('test-results/spikes/day4d.json') != ''
        run: jq -r 'to_entries[] | select(.key != "recorded_at") | "::notice title=Spike \(.key)::\(.value | tojson)"' test-results/spikes/day4d.json
      # Home and the command menu at 1280/1440/1728 in this engine (shell.spec).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: shell-screens-${{ matrix.browser }}-${{ matrix.part }}
          path: test-results/shell-screens/
          retention-days: 14
      - if: always()
        run: npx supabase stop --no-backup
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install semgrep==1.180.0
      - run: semgrep scan --config p/default --config p/typescript --config p/nextjs --error --metrics=off
