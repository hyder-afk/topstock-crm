# Every PR: lint, typecheck, build, Playwright (signed-out + full sign-in journey), npm audit (runtime deps), Semgrep.
# gitleaks runs in gitleaks.yml; database RLS tests in db.yml.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
env:
  # Public placeholders so the build and tests never need real project values.
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-publishable-key
  NEXT_TELEMETRY_DISABLED: "1"
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm audit --omit=dev --audit-level=high
      - name: npm audit (dev tooling, report only)
        run: npm audit --audit-level=critical || true
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
  # The whole sign-in journey (invite email, password, two-factor wall, sign-in, reset) against a throwaway local
  # Supabase. Uses only the local stack's built-in demo keys; no project values or secrets.
  auth-journey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start local Supabase (database, auth, REST, gateway, mail inbox)
        run: npx supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Read the local stack's URL and demo keys
        run: |
          npx supabase status -o json > "$RUNNER_TEMP/sb.json"
          echo "status keys: $(jq -r 'keys | join(", ")' "$RUNNER_TEMP/sb.json")"
          url=$(jq -r '.API_URL // empty' "$RUNNER_TEMP/sb.json")
          anon=$(jq -r '.ANON_KEY // .PUBLISHABLE_KEY // empty' "$RUNNER_TEMP/sb.json")
          service=$(jq -r '.SERVICE_ROLE_KEY // .SECRET_KEY // empty' "$RUNNER_TEMP/sb.json")
          mail=$(jq -r '.MAILPIT_URL // .INBUCKET_URL // "http://127.0.0.1:54324"' "$RUNNER_TEMP/sb.json")
          rm "$RUNNER_TEMP/sb.json"
          test -n "$url" && test -n "$anon" && test -n "$service"
          echo "::add-mask::$service"
          {
            echo "LOCAL_URL=$url"
            echo "LOCAL_ANON=$anon"
            echo "SUPABASE_LOCAL_URL=$url"
            echo "SUPABASE_LOCAL_SERVICE_ROLE_KEY=$service"
            echo "MAILPIT_URL=$mail"
          } >> "$GITHUB_ENV"
      - name: Build against the local stack
        run: NEXT_PUBLIC_SUPABASE_URL="$LOCAL_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="$LOCAL_ANON" npm run build
      - run: npx playwright install --with-deps chromium
      - name: Sign-in journey
        run: NEXT_PUBLIC_SUPABASE_URL="$LOCAL_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="$LOCAL_ANON" npx playwright test -c playwright.auth.config.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: auth-journey-report
          path: test-results/
          retention-days: 7
      # Evidence screenshots of the signed-in sign-in screens (fake local users only).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success()
        with:
          name: auth-screens
          path: test-results/screens/
          retention-days: 14
      - if: always()
        run: npx supabase stop --no-backup
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install semgrep==1.180.0
      - run: semgrep scan --config p/default --config p/typescript --config p/nextjs --error --metrics=off
