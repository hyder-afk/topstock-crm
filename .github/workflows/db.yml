# Database checks on every PR: apply all migrations to the real Supabase Postgres (local, throwaway, no keys),
# run the two-user RLS attack test, the lead import attack test and its two-session test, the activity and task
# hardening attack test and its two-session test, the lead page attack and concurrency tests (Day 4b), the stock
# engine attack test and its concurrency test (Day 6a), the inventory reads attack test (Day 6b), the
# stock sheet import attack and concurrency tests (Day 6c), the Supabase advisors (splinter) and lint the SQL functions.
name: db
on:
  pull_request:
    paths: ["supabase/**", ".github/workflows/db.yml", "package.json", "package-lock.json"]
  push:
    branches: [main]
    paths: ["supabase/**"]
permissions:
  contents: read
jobs:
  rls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start local Supabase (applies supabase/migrations)
        run: npx supabase start -x realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Two-user RLS attack test
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -q -v ON_ERROR_STOP=1 -f supabase/tests/rls_attack.sql
      - name: Lead import attack test
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -q -v ON_ERROR_STOP=1 -f supabase/tests/import_attack.sql
      - name: Lead import under concurrency (two sessions)
        run: bash supabase/tests/import_concurrency.sh "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
      - name: Activity and task hardening attack test (Day 4a)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -q -v ON_ERROR_STOP=1 -f supabase/tests/activity_attack.sql
      - name: Last activity under concurrency (two sessions, Day 4a)
        run: bash supabase/tests/activity_concurrency.sh "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
      - name: Lead page attack test (Day 4b outcomes, undo, zones)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -q -v ON_ERROR_STOP=1 -f supabase/tests/outcome_attack.sql
      - name: Outcomes under concurrency (two sessions)
        run: bash supabase/tests/outcome_concurrency.sh "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
      - name: Stock engine attack test (Day 6a)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -q -v ON_ERROR_STOP=1 -f supabase/tests/stock_attack.sql
      - name: Stock engine under concurrency (2 to 20 sessions, Day 6a)
        run: bash supabase/tests/stock_concurrency.sh "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
      - name: Inventory reads attack test (Day 6b)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -q -v ON_ERROR_STOP=1 -f supabase/tests/inventory_attack.sql
      - name: Stock sheet import attack test (Day 6c)
        run: psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -X -q -v ON_ERROR_STOP=1 -f supabase/tests/stock_import_attack.sql
      - name: Stock sheet import under concurrency (Day 6c)
        run: bash supabase/tests/stock_import_concurrency.sh "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
      - name: Supabase security and performance advisors (fail on ERROR)
        run: bash scripts/db-advisors.sh "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
      - name: Lint SQL functions
        run: npx supabase db lint --local --level warning --fail-on error
      - if: always()
        run: npx supabase stop --no-backup
