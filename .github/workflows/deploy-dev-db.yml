# On merge to main: apply auth settings (invite-only, MFA, password rules; custom email templates once custom SMTP exists) to the DEV project only,
# prove sign-ups are closed and the REST API exposes only the public schema, then apply migrations.
# Secrets are pasted by Haider (Cloud Workflow section 5). The production project is never reachable from this repo.
name: deploy-dev-db
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**", "supabase/config.toml", "supabase/templates/**", "scripts/strip-email-templates.py", ".github/workflows/deploy-dev-db.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-dev-db
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
      DEV_PROJECT_REF: swhkafqlmfhvgpsgdqjp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase link --project-ref "$DEV_PROJECT_REF"
      # Free Supabase projects on the default email sender refuse custom email templates (first run, 9 Oct 2026).
      # Until TopStock has its own SMTP sender (Gate 1), dev keeps Supabase's default emails; CI's local stack
      # keeps testing ours. Remove this step (and scripts/strip-email-templates.py) once custom SMTP is set up.
      - name: Leave out custom email templates for dev (no custom SMTP yet)
        run: python3 scripts/strip-email-templates.py supabase/config.toml
      # Auth settings go first: the schema makes the first new user an admin, so sign-ups must be closed
      # (and proven closed) before any migration lands.
      - name: Show auth settings diff (logged for review)
        run: npx supabase config diff
      - name: Apply auth settings to dev
        run: npx supabase config push --yes
      - name: Prove sign-ups are closed on dev (stops the job otherwise)
        run: |
          disabled=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$DEV_PROJECT_REF/config/auth" | jq -r '.disable_signup')
          if [ "$disabled" != "true" ]; then
            echo "::error::Dev sign-ups are not closed (disable_signup=$disabled). Migrations were not applied."
            exit 1
          fi
          echo "Dev sign-ups closed."
      # Staged lead rows live in the private schema and stay off the REST API only because the API exposes nothing but
      # public (config.toml: api.schemas = ["public"]). Read back what dev really exposes, so dashboard changes or config
      # drift stop the deploy before any migration lands. The answer also carries the project's JWT secret: only the
      # schema list is taken out of it (jq), and the token and the answer are never printed.
      - name: Prove the dev REST API exposes only the public schema (stops the job otherwise)
        shell: bash
        run: |
          if ! schemas=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$DEV_PROJECT_REF/postgrest" \
              | jq -er '.db_schema | strings | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(. != "")) | unique | join(",")'); then
            echo "::error::Could not read which schemas the dev REST API exposes. Migrations were not applied."
            exit 1
          fi
          if [ "$schemas" != "public" ]; then
            echo "::error::The dev REST API exposes '$schemas'; only public is allowed (supabase/config.toml). Migrations were not applied."
            exit 1
          fi
          echo "Dev REST API exposes only: $schemas"
      - name: Apply migrations to dev
        run: npx supabase db push --yes
