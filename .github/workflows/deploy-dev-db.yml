# On merge to main: apply migrations and auth settings (invite-only, MFA, password rules, email templates) to the DEV project only.
# Secrets are pasted by Haider (Cloud Workflow section 5). The production project is never reachable from this repo.
name: deploy-dev-db
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**", "supabase/config.toml", "supabase/templates/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-dev-db
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DEV_DB_PASSWORD }}
      DEV_PROJECT_REF: swhkafqlmfhvgpsgdqjp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx supabase link --project-ref "$DEV_PROJECT_REF"
      # Auth settings go first: the schema makes the first new user an admin, so sign-ups must be closed
      # (and proven closed) before any migration lands.
      - name: Show auth settings diff (logged for review)
        run: npx supabase config diff
      - name: Apply auth settings to dev
        run: npx supabase config push --yes
      - name: Prove sign-ups are closed on dev (stops the job otherwise)
        run: |
          disabled=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$DEV_PROJECT_REF/config/auth" | jq -r '.disable_signup')
          if [ "$disabled" != "true" ]; then
            echo "::error::Dev sign-ups are not closed (disable_signup=$disabled). Migrations were not applied."
            exit 1
          fi
          echo "Dev sign-ups closed."
      - name: Apply migrations to dev
        run: npx supabase db push --yes
